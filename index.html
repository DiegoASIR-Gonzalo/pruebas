/* ===== Jornada actual ===== */
.current-week-panel{margin:18px 0 0;border-top:1px solid #252525;background:#080808;padding:13px 12px}
.current-week-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.current-week-kicker{font-size:9px;color:#777;text-transform:uppercase;letter-spacing:.08em}
.current-week-title{font-size:19px;font-weight:900;margin-top:3px}
.current-week-badge{font-size:9px;color:#bfbfbf;border:1px solid #292929;padding:5px 7px;white-space:nowrap}
.current-week-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px}
.current-week-stat{border:1px solid #202020;background:#0b0b0b;padding:8px}
.current-week-stat span{display:block;color:#666;font-size:8px;text-transform:uppercase;letter-spacing:.06em}
.current-week-stat b{display:block;font-size:11px;margin-top:3px;color:#eee}
.current-week-note{margin-top:8px;font-size:9px;color:#666;line-height:1.45}
.current-week-state{font-size:9px;color:#666;min-height:14px;margin-top:8px}
.current-week-error{font-size:9px;color:#ef9da6;line-height:1.45}
@media(min-width:700px){
  .current-week-panel{max-width:920px;margin:22px auto 0;padding:15px 16px}
  .current-week-title{font-size:22px}
}

/* ===== Calendario ===== */
.calendar-panel{padding:0 10px 24px}
.calendar-toolbar{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.calendar-nav{display:flex;align-items:center;gap:6px}
.calendar-nav button{padding:8px 10px;background:#0b0b0b;border-color:#292929}
.calendar-week-input{width:88px;text-align:center;font-weight:800;background:#090909!important}
.calendar-current{margin-left:auto;font-size:9px;color:#777;text-transform:uppercase;letter-spacing:.08em}
.calendar-status{font-size:10px;color:#666;min-height:16px;margin:-2px 0 10px}
.calendar-week-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid #292929;padding:8px 0 10px;margin-bottom:0}
.calendar-week-title{font-size:20px;font-weight:900;letter-spacing:-.02em}
.calendar-week-subtitle{font-size:10px;color:#777;margin-top:3px}
.calendar-count{font-size:10px;color:#aaa;white-space:nowrap}
.calendar-list{display:grid;gap:0;border-top:1px solid #202020}
.calendar-day{border-bottom:1px solid #202020}
.calendar-day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;background:#070707}
.calendar-day-name{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#aaa}
.calendar-day-date{font-size:10px;color:#666}
.calendar-match{display:grid;grid-template-columns:58px minmax(0,1fr) 64px;gap:10px;align-items:center;padding:11px 2px;border-top:1px solid #181818}
.calendar-time{font-size:10px;color:#777;text-align:center}
.calendar-teams{display:grid;gap:7px;min-width:0}
.calendar-team-row{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;align-items:center;min-width:0}
.calendar-team-logo{width:30px;height:30px;object-fit:contain;background:#151515;display:block}
.calendar-team-name{font-size:12px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calendar-team-role{font-size:8px;color:#555;margin-top:1px;text-transform:uppercase;letter-spacing:.06em}
.calendar-score{display:grid;gap:4px;text-align:center;font-size:13px;font-weight:900}
.calendar-score span{display:block}
.calendar-score .scheduled{font-size:9px;color:#555;font-weight:700}
.calendar-status-pill{font-size:8px;color:#777;text-transform:uppercase;letter-spacing:.06em;text-align:center}
.calendar-empty{border:1px dashed #333;padding:28px 16px;text-align:center;color:#666;font-size:11px}
.calendar-error{border:1px solid #54242a;background:#13090a;padding:14px;color:#ef9da6;font-size:10px;line-height:1.45}
.calendar-route-note{font-size:9px;color:#555;margin-top:10px}
.calendar-go{font-size:10px;font-weight:800;white-space:nowrap}
.calendar-status.loading{color:#f8da7d}.calendar-status.ok{color:#9ef0cc}.calendar-status.bad{color:#ff9baa}
.calendar-time strong,.calendar-time span{display:block}.calendar-time strong{color:#ddd;font-size:11px}.calendar-time span{font-size:8px;color:#666;margin-top:2px;white-space:nowrap}
.calendar-team-fallback{width:30px;height:30px;display:grid;place-items:center;background:#171717;border:1px solid #353535;color:#bcbcbc;font-size:9px;font-weight:900}
.calendar-team-score{font-size:12px;color:#e9e9e9;font-weight:900}.calendar-team-score.scheduled{color:#555;font-size:10px}
.calendar-score .calendar-status-pill{margin-top:1px;line-height:1.15}
@media(max-width:699px){
  .calendar-toolbar{align-items:stretch}
  .calendar-current{display:none}
  .calendar-week-title{font-size:17px}
  .calendar-match{grid-template-columns:48px minmax(0,1fr) 54px;gap:7px}
  .calendar-team-name{font-size:11px}
}
@media(min-width:700px){
  .calendar-panel{padding:0}
  .calendar-toolbar{max-width:920px;margin:0 auto 12px}
  .calendar-week-head,.calendar-list{max-width:920px;margin-left:auto;margin-right:auto}
  .calendar-match{grid-template-columns:76px minmax(0,1fr) 90px;padding:13px 8px}
  .calendar-team-row{grid-template-columns:38px minmax(0,1fr) auto}
  .calendar-team-logo{width:36px;height:36px}
  .calendar-team-name{font-size:14px}
  .calendar-time{font-size:11px}
  .calendar-score{font-size:15px}
}
